name: Update Dashboard

on:
  schedule:
    - cron: '0 7 * * *'  # every day 07:00 UTC
  workflow_dispatch:       # manual trigger

jobs:
  update:
    name: Rebuild contributor stats
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate dashboard
        env:
          # Needs a PAT with 'repo' scope to read the PRIVATE TradeZara repos.
          # The default GITHUB_TOKEN only has access to THIS repo, which produced
          # a silently zeroed-out dashboard. Set TRADEZARA_PAT in repo secrets.
          GH_TOKEN: ${{ secrets.TRADEZARA_PAT }}
        run: python3 scripts/generate_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: auto-update dashboard stats [skip ci]"
          git push
